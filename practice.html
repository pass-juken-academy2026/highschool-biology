<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高校生物｜演習・弱点分析</title><style>:root{color-scheme:dark;--bg:#071426;--panel:#10233d;--line:#294563;--txt:#edf5ff;--muted:#c3d5e9;--accent:#7bdcff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#14345a 0,transparent 48%),var(--bg);color:var(--txt);font:16px/1.65 system-ui,-apple-system,sans-serif}main{max-width:900px;margin:auto;padding:20px}h1{font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.2}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:15px 0}.grid,.units,.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.subject,.unit,.mode,.choice{display:flex;gap:10px;align-items:flex-start;padding:13px;border-radius:12px;background:#091a2e;border:1px solid #294563;color:var(--txt)}.subject{align-items:center;font-weight:800;cursor:pointer}.unit,.mode{cursor:pointer}.subject input,.unit input,.mode input{accent-color:var(--accent);width:20px;height:20px;flex-shrink:0;margin-top:3px}button,select{font:inherit;font-weight:800;border-radius:10px;padding:12px 16px;border:1px solid #438bb0;background:#17658b;color:#fff;cursor:pointer;min-height:46px}button{width:100%}button:disabled{opacity:.5;cursor:not-allowed}.pill{display:inline-block;padding:4px 10px;border-radius:99px;background:#203c5d;color:#c9eaff;font-size:.85rem}.error{color:#ffd0c8;min-height:1.4em}.formula,.explain{background:#091a2e;border-left:4px solid var(--accent);padding:13px;margin:12px 0;border-radius:8px}.choice{display:block;width:100%;text-align:left;margin:10px 0;cursor:pointer}.choice.selected{border:2px solid var(--accent)}.choice.correct{border:2px solid #5bd6a3}.choice.wrong{border:2px solid #ff9b9b}.hidden{display:none!important}.progress{height:8px;background:#263d58;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent);width:0}@media(max-width:560px){main{padding:12px}.panel{padding:14px}.grid,.units,.modes{grid-template-columns:1fr}}</style><style id="responsive-layout-polish">/* Responsive layout and touch-target polish; learning data unchanged. */*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:5rem}body{max-width:100%;overflow-wrap:anywhere}img,svg,canvas,video{max-width:100%;height:auto}button,input,select,textarea{font:inherit;max-width:100%;min-width:0}button,a,[role="button"]{touch-action:manipulation}button{min-height:42px}:where(button,a,input,select,textarea,[role="button"],[tabindex]):focus-visible{outline:3px solid #65c9f1;outline-offset:3px}@media(max-width:640px){body{font-size:16px;line-height:1.65}header,main{padding-left:max(16px,env(safe-area-inset-left))!important;padding-right:max(16px,env(safe-area-inset-right))!important}h1{font-size:clamp(1.55rem,7vw,2.25rem)!important;line-height:1.2}h2{font-size:clamp(1.15rem,5vw,1.45rem)}.grid,.cards,.subject-grid,.subjects,.menu-grid,.topic-grid,.cards-grid,.dashboard,.two-col,.three-col{grid-template-columns:minmax(0,1fr)!important}.card,.panel,.topic-card,.menu-card{min-width:0;overflow-wrap:anywhere}button{min-height:44px}.choices button{width:100%;text-align:left;white-space:normal}table{display:block;max-width:100%;overflow-x:auto}pre,code{overflow-wrap:anywhere;white-space:pre-wrap}input,select,textarea{font-size:16px}}</style></head><body><main><a href="./index.html">← 科目・範囲選択へ戻る</a><h1>高校生物｜演習ラボ</h1><p id="selected" class="muted"></p><section class="panel" id="setup"><h2>演習方法</h2><label for="mode">学習方法</label><br><select id="mode"><option value="basic">基本問題</option><option value="truefalse">正誤問題</option><option value="common">共通テスト型演習</option><option value="mock">模擬テスト・弱点分析</option></select><p id="modeInfo" class="muted"></p><button id="start">演習を開始</button></section><section class="panel hidden" id="quiz"><span id="counter" class="pill"></span><div class="progress"><span id="bar"></span></div><h2 id="question"></h2><div id="choices"></div><div id="feedback" class="explain hidden" role="status" aria-live="polite"></div><button id="check">解答する</button><p><button id="next" disabled>次へ</button></p></section><section class="panel hidden" id="result"><h2>結果・弱点分析</h2><p id="summary"></p><p id="analysis" class="muted"></p><div id="missed"></div><button id="review">間違えた問題を復習</button><p><button id="again">もう一度挑戦</button></p></section></main><script>
const p=new URLSearchParams(location.search),subject=p.get('subject')||'foundation',units=(p.get('units')||'').split(',').filter(Boolean),initial=p.get('mode')||'basic',BANK=[["f0","細胞膜の主な働きは？",["細胞内外の物質移動を調節する","遺伝情報を必ず分解する","光だけを作る","細胞を常に動かす"],0,"細胞膜は物質の出入りを選択的に調節する。"],["f1","DNAの塩基対の組み合わせは？",["A-G、C-T","A-T、G-C","A-C、G-T","A-U、G-Cのみ"],1,"DNAではAとT、GとCが相補的に対合する。"],["f2","体内環境を一定範囲に保つ仕組みは？",["恒常性（ホメオスタシス）","蒸発だけ","進化だけ","光合成"],0,"神経系や内分泌系などが関わって体内環境を調節する。"],["f3","抗体を主に産生する細胞は？",["赤血球","形質細胞","血小板","神経細胞"],1,"B細胞が分化した形質細胞が抗体を産生する。"],["a0","酵素の一般的な働きは？",["活性化エネルギーを下げる","反応後に必ず消費される","全反応を停止する","平衡を必ず一方向へ移す"],0,"酵素は触媒として反応を促進し、基質特異性を示す。"],["a1","細胞呼吸でエネルギーを取り出す際に重要な分子は？",["ATP","セルロースのみ","抗体のみ","メラニンのみ"],0,"細胞呼吸で得たエネルギーはATPの合成などに利用される。"],["a2","転写で作られるものは？",["DNAからRNA","タンパク質からDNA","脂質からRNA","ATPから染色体"],0,"転写ではDNAの塩基配列をもとにRNAが合成される。"],["a3","独立の法則がそのまま適用できない代表例は？",["異なる染色体上の遺伝子","連鎖した遺伝子","完全に独立な遺伝子","無関係な形質"],1,"同じ染色体上で連鎖している遺伝子は独立に分配されない場合がある。"],["a4","反射の基本的な説明として正しいのは？",["刺激に対する無意識の反応","必ず学習して得る行動","植物だけにある現象","遺伝情報がない状態"],0,"反射は刺激に対する比較的すばやい不随意反応。"],["a5","植物ホルモンのオーキシンが関係する現象は？",["屈光性","血液凝固","抗体産生","腎臓でのろ過のみ"],0,"オーキシンは細胞伸長などを通じて屈光性に関わる。"],["a6","生態系でエネルギーが移動するとき正しいのは？",["食物連鎖の各段階で一部が熱として失われる","エネルギーが完全に循環する","分解者は関係しない","生産者は必ず動物"],0,"物質は循環するが、エネルギーは各段階で熱として散逸する。"],["a7","自然選択について正しい説明は？",["環境に適した遺伝的変異が世代を通じて増えることがある","個体が必要に応じて遺伝子を自由に変える","全ての個体が同時に同じ変異を得る","進化は必ず複雑化する"],0,"遺伝的変異と繁殖成功の差が集団の形質頻度を変化させる。"]];
const allNames={"f0":"生物の特徴・細胞","f1":"遺伝情報とDNA","f2":"体内環境・恒常性","f3":"免疫","f4":"植生・生態系","a0":"生命現象と物質","a1":"代謝","a2":"遺伝情報の発現","a3":"発生・遺伝","a4":"動物の反応と行動","a5":"植物の環境応答","a6":"生態と環境","a7":"進化・系統"};
const modes={basic:'基本知識を使う問題です。',truefalse:'内容と条件を確認します。',common:'資料や実験の考え方を含む問題を出題します。',mock:'選択範囲から出題し、結果をもとに復習します。'};
const $=id=>document.getElementById(id);let questions=[],idx=0,answers=[],locked=false;
$('selected').textContent='科目：'+(subject==='advanced'?'生物':'生物基礎')+' ／ 範囲：'+units.map(x=>allNames[x]||x).join('・');
$('mode').value=['basic','truefalse','common','mock'].includes(initial)?initial:'basic';$('modeInfo').textContent=modes[$('mode').value];$('mode').addEventListener('change',()=>{$('modeInfo').textContent=modes[$('mode').value]});
function start(list){let source=list||BANK.filter(q=>!units.length||units.includes(q[0]));if(!source.length){$('feedback').textContent='選択範囲の問題は準備中です。範囲選択へ戻ってください。';$('feedback').classList.remove('hidden');return}const mode=$('mode').value;if(!list&&mode==='basic')source=source.slice(0,Math.min(8,source.length));if(!list&&mode==='truefalse')source=source.map(q=>[q[0],'【正誤確認】'+q[1],['正しい','誤り'],q[3]===0?0:1,q[4]]);if(!list&&mode==='common')source=source.filter(q=>/条件|関係|推定|仕組み|変化|影響|働き/.test(q[1]));if(!source.length)source=list||BANK.filter(q=>!units.length||units.includes(q[0]));questions=[...source].sort(()=>Math.random()-.5);idx=0;answers=[];$('setup').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}
function render(){locked=false;const q=questions[idx];$('counter').textContent=(idx+1)+' / '+questions.length;$('bar').style.width=(idx/questions.length*100)+'%';$('question').textContent=q[1];$('choices').replaceChildren();q[2].forEach((v,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'．'+v;b.addEventListener('click',()=>{if(locked)return;answers[idx]=answers[idx]||{};answers[idx].selected=i;[...$('choices').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});$('choices').append(b)});$('feedback').classList.add('hidden');$('check').disabled=false;$('next').disabled=true;$('next').textContent=idx===questions.length-1?'結果を見る':'次の問題 →'}
$('start').addEventListener('click',()=>start());$('check').addEventListener('click',()=>{if(locked)return;if(!answers[idx]||answers[idx].selected===undefined){$('feedback').textContent='選択肢を選んでください。';$('feedback').classList.remove('hidden');return}locked=true;const q=questions[idx],a=answers[idx];a.correct=a.selected===q[3];[...$('choices').children].forEach((b,i)=>{b.disabled=true;if(i===q[3])b.classList.add('correct');if(i===a.selected&&i!==q[3])b.classList.add('wrong')});$('feedback').textContent=(a.correct?'正解！':'不正解。正解は'+String.fromCharCode(65+q[3])+'。')+q[4];$('feedback').classList.remove('hidden');$('check').disabled=true;$('next').disabled=false});
$('next').addEventListener('click',()=>{if(idx<questions.length-1){idx++;render()}else finish()});
function finish(){ $('quiz').classList.add('hidden');$('result').classList.remove('hidden');const good=answers.filter(a=>a&&a.correct).length,wrong=questions.map((q,i)=>({q,a:answers[i]})).filter(x=>!x.a||!x.a.correct);$('summary').textContent=good+' / '+questions.length+'問正解（正答率 '+Math.round(good/questions.length*100)+'%）';const counts={};wrong.forEach(x=>counts[allNames[x.q[0]]||x.q[0]]=(counts[allNames[x.q[0]]||x.q[0]]||0)+1);$('analysis').textContent=wrong.length?'復習が必要な範囲：'+Object.entries(counts).map(([k,v])=>k+'（'+v+'問）').join('、'):'全問正解！用語や条件も説明できるか確認しよう。';$('missed').innerHTML=wrong.map(x=>'<article class="explain"><b>'+x.q[1]+'</b><p>正解：'+x.q[2][x.q[3]]+'</p><p>'+x.q[4]+'</p></article>').join('')||'間違えた問題はありません。';$('review').disabled=!wrong.length;$('review').onclick=()=>start(wrong.map(x=>x.q));$('again').onclick=()=>{$('setup').classList.remove('hidden');$('result').classList.add('hidden')}}
$('review').disabled=true;
</script></body></html>
