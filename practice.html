<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="高校生物のオリジナル受験対策演習。共通テスト風演習・模擬テスト・採点・解説。"><title>高校生物｜演習・模擬テスト</title><style>
:root{color-scheme:dark;--bg:#071426;--panel:#10233d;--line:#294563;--txt:#edf5ff;--muted:#c3d5e9;--accent:#7bdcff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#14345a 0,transparent 48%),var(--bg);color:var(--txt);font:16px/1.7 system-ui,sans-serif}
main{max-width:900px;margin:auto;padding:20px}a{color:var(--accent)}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0}.muted{color:var(--muted)}.tag{color:var(--accent);font-weight:700;font-size:.85rem}h1{font-size:clamp(1.7rem,5vw,2.5rem);line-height:1.2}button,select{font:inherit;border-radius:10px;padding:11px 14px;border:1px solid #438bb0;background:#17658b;color:white;cursor:pointer;min-height:44px}button:disabled{opacity:.5;cursor:not-allowed}.choice{display:block;width:100%;text-align:left;margin:10px 0;background:#091a2e;border:1px solid #355575;color:var(--txt)}.choice.selected{border:2px solid var(--accent);background:#173654}.choice.correct{border:2px solid #5bd6a3}.choice.wrong{border:2px solid #ff9b9b}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.progress{height:8px;background:#263d58;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent);width:0}.explain{border-left:3px solid var(--accent);padding:10px 14px;background:#0b1b30;border-radius:8px}.hidden{display:none!important}.pill{display:inline-block;padding:3px 9px;border-radius:99px;background:#203c5d;color:#c9eaff;font-size:.85rem}@media(max-width:600px){main{padding:12px}.panel{padding:15px}}
</style></head><body><main><div class="top"><a href="./index.html">← 科目トップへ戻る</a><span class="pill">オリジナル問題</span></div><h1>高校生物 演習ラボ</h1><p class="muted">知識の確認から資料・文章を読み取る問題まで。解答後に採点し、解説と復習問題を確認できます。</p><section class="panel" id="setup"><h2>演習を設定</h2><label for="mode">演習モード</label><select id="mode"><option value="common">共通テスト風演習</option><option value="mock">模擬テスト・弱点分析</option><option value="basic">基礎確認</option></select><p id="modeInfo" class="muted">知識・読解・資料活用を組み合わせたオリジナル問題</p><button id="start">テストを開始</button></section><section class="panel hidden" id="quiz" aria-live="polite"><div class="top"><span id="counter" class="pill"></span><span id="scoreLive" class="muted"></span></div><div class="progress"><span id="bar"></span></div><h2 id="question"></h2><div id="choices"></div><div id="feedback" class="explain hidden"></div><div class="row" style="margin-top:18px"><button id="check">解答する</button><button id="next" disabled>次の問題 →</button></div></section><section class="panel hidden" id="result"><h2>結果・弱点分析</h2><p id="summary"></p><p id="analysis" class="muted"></p><h3>間違えた問題</h3><div id="missed"></div><div class="row"><button id="review">間違えた問題を復習</button><button id="again">もう一度挑戦</button></div></section><p class="muted">※本番問題の転載ではなく、学習用に作成したオリジナル問題です。出題範囲は今後拡充します。</p></main><script>
const BANK=[["DNAを構成する基本単位は？",["アミノ酸","ヌクレオチド","脂肪酸","単糖だけ"],1,"DNAはリン酸・糖・塩基からなるヌクレオチドが連なった分子。"],["光合成が主に行われる細胞小器官は？",["ミトコンドリア","リボソーム","葉緑体","ゴルジ体"],2,"植物細胞の葉緑体で光エネルギーを利用して有機物を合成する。"],["酵素の働きとして正しいのは？",["反応の活性化エネルギーを下げる","反応後に必ず消費し尽くされる","すべての温度で同じ働きをする","平衡を必ず一方向に変える"],0,"酵素は触媒として活性化エネルギーを下げ、反応を促進する。"],["生態系で生産者にあたるものは一般に？",["植物や藻類","肉食動物のみ","分解者のみ","すべての消費者"],0,"生産者は光合成などで無機物から有機物をつくる。"],["体細胞分裂の結果として基本的にできる細胞は？",["遺伝情報がほぼ同じ2個の細胞","染色体が必ず半分の細胞","必ず4個の細胞","核のない細胞だけ"],0,"体細胞分裂では、通常、親細胞と同じ染色体数の娘細胞が2個できる。"],["個体群の密度が上がると競争が強まりやすい資源は？",["無限にある資源だけ","食物や生息場所","遺伝子だけ","太陽系の惑星"],1,"限られた食物・空間・光などをめぐる競争が強くなることがある。"],["【実験考察】植物を暗所に置いた後、葉の一部を遮光して光を当て、ヨウ素液で調べる。青紫色になりやすい部分は？",["光が当たった部分","遮光した部分だけ","葉柄だけ","根だけ"],0,"光が当たった部分では光合成でデンプンがつくられ、ヨウ素液で青紫色になる。"],["【遺伝】ある遺伝子型Aaの個体が、減数分裂でつくる配偶子として考えられるのは？（分離の法則を前提）",["Aのみ","aのみ","Aとa","Aaのみ"],2,"対立遺伝子Aとaは減数分裂で分かれ、Aまたはaをもつ配偶子ができる。"],["【生態系】食物連鎖で生産者から高次消費者へ移るエネルギーについて一般的に正しいのは？",["各段階で利用可能なエネルギーは減少する","必ず全量が次へ移る","高次ほど必ず増える","エネルギーは循環して失われない"],0,"呼吸などで熱として放出されるため、次の栄養段階へ移るエネルギーは一部に限られる。"],["【細胞】ミトコンドリアの主な役割は？",["細胞呼吸によるATP合成に関わる","遺伝情報をすべて外へ排出する","光合成だけを行う","細胞壁をつくる"],0,"ミトコンドリアは細胞呼吸に関わり、ATPを合成する。"]
]; 
const $=id=>document.getElementById(id);let questions=[],idx=0,answers=[],locked=false,reviewOnly=false;
const modes={common:"知識・読解・資料活用を組み合わせたオリジナル問題",mock:"基礎から応用までを確認し、苦手分野を振り返ります",basic:"重要用語・基本事項をテンポよく確認します"};
$("mode").addEventListener("change",()=> $("modeInfo").textContent=modes[$("mode").value]);
function start(list=null,review=false){const mode=$("mode").value;let source=list||BANK;if(!list&&mode==="basic")source=BANK.slice(0,6);if(!list&&mode==="common")source=BANK.filter(q=>/【(実験データ|グラフ読解|力学|波|実験考察|遺伝|生態系|細胞|地震資料|気象|天体|地質|統計読解|歴史資料|地理|比較)/.test(q[0]));if(!list&&mode==="mock")source=[...BANK];questions=[...source].sort(()=>Math.random()-.5);if(!questions.length)questions=[...BANK];idx=0;answers=[];locked=false;reviewOnly=review;$("setup").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()}
function render(){const q=questions[idx];locked=false;$("counter").textContent=(idx+1)+" / "+questions.length;$("scoreLive").textContent="回答済み "+answers.filter(a=>a&&a.selected!==undefined).length+"問";$("bar").style.width=(idx/questions.length*100)+"%";$("question").textContent=q[0];$("choices").innerHTML="";q[1].forEach((t,i)=>{const b=document.createElement("button");b.className="choice";b.textContent=["A","B","C","D"][i]+"．"+t;b.addEventListener("click",()=>{if(locked)return;answers[idx]={selected:i};[...$("choices").children].forEach(x=>x.classList.remove("selected"));b.classList.add("selected")});$("choices").appendChild(b)});$("feedback").classList.add("hidden");$("feedback").textContent="";$("check").disabled=false;$("next").disabled=true;$("next").textContent=idx===questions.length-1?"結果を見る":"次の問題 →"}
$("start").addEventListener("click",()=>start());
$("check").addEventListener("click",()=>{if(locked)return;if(!answers[idx]||answers[idx].selected===undefined){$("feedback").textContent="選択肢を選んでね。";$("feedback").classList.remove("hidden");return}locked=true;const q=questions[idx],a=answers[idx];a.correct=a.selected===q[2];[...$("choices").children].forEach((b,i)=>{b.disabled=true;if(i===q[2])b.classList.add("correct");if(i===a.selected&&i!==q[2])b.classList.add("wrong")});$("feedback").textContent=(a.correct?"正解！":"不正解。正解は "+["A","B","C","D"][q[2]]+"。")+" "+q[3];$("feedback").classList.remove("hidden");$("check").disabled=true;$("next").disabled=false;$("scoreLive").textContent="現在 "+answers.filter(x=>x&&x.correct).length+"問正解"});
$("next").addEventListener("click",()=>{if(idx<questions.length-1){idx++;render()}else finish()});
function finish(){ $("quiz").classList.add("hidden");$("result").classList.remove("hidden");const good=answers.filter(a=>a&&a.correct).length;const wrong=questions.map((q,i)=>({q,a:answers[i]})).filter(x=>!x.a||!x.a.correct);$("summary").textContent=good+" / "+questions.length+"問正解（正答率 "+Math.round(good/questions.length*100)+"%）";$("analysis").textContent=good===questions.length?"全問正解！知識だけでなく、根拠を説明できるかも確認しよう。":wrong.length+"問を復習リストに入れました。解説を読み、なぜその選択肢が正しいかを自分の言葉で説明してみよう。";$("missed").innerHTML=wrong.length?wrong.map(x=>'<div class="explain" style="margin:10px 0"><strong>'+x.q[0]+'</strong><p>正解：'+x.q[1][x.q[2]]+'</p><p>'+x.q[3]+'</p></div>').join(""):"間違えた問題はありません。";$("review").disabled=!wrong.length;$("review").onclick=()=>start(wrong.map(x=>x.q),true);$("again").onclick=()=>start()}
</script></body></html>
