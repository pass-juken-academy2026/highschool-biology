<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高校化学｜重要事項</title><style>:root{color-scheme:dark;--bg:#071426;--panel:#10233d;--line:#294563;--txt:#edf5ff;--muted:#c3d5e9;--accent:#7bdcff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#14345a 0,transparent 48%),var(--bg);color:var(--txt);font:16px/1.65 system-ui,-apple-system,sans-serif}main{max-width:900px;margin:auto;padding:20px}h1{font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.2}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:15px 0}.grid,.units,.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.subject,.unit,.mode,.choice{display:flex;gap:10px;align-items:flex-start;padding:13px;border-radius:12px;background:#091a2e;border:1px solid #294563;color:var(--txt)}.subject{align-items:center;font-weight:800;cursor:pointer}.unit,.mode{cursor:pointer}.subject input,.unit input,.mode input{accent-color:var(--accent);width:20px;height:20px;flex-shrink:0;margin-top:3px}button,select{font:inherit;font-weight:800;border-radius:10px;padding:12px 16px;border:1px solid #438bb0;background:#17658b;color:#fff;cursor:pointer;min-height:46px}button{width:100%}button:disabled{opacity:.5;cursor:not-allowed}.pill{display:inline-block;padding:4px 10px;border-radius:99px;background:#203c5d;color:#c9eaff;font-size:.85rem}.error{color:#ffd0c8;min-height:1.4em}.formula,.explain{background:#091a2e;border-left:4px solid var(--accent);padding:13px;margin:12px 0;border-radius:8px}.choice{display:block;width:100%;text-align:left;margin:10px 0;cursor:pointer}.choice.selected{border:2px solid var(--accent)}.choice.correct{border:2px solid #5bd6a3}.choice.wrong{border:2px solid #ff9b9b}.hidden{display:none!important}.progress{height:8px;background:#263d58;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent);width:0}@media(max-width:560px){main{padding:12px}.panel{padding:14px}.grid,.units,.modes{grid-template-columns:1fr}}</style><style id="responsive-layout-polish">
/* Responsive layout and touch-target polish; content and learning data are unchanged. */

</style></head><body><main><a href="./index.html">← 科目・範囲選択へ戻る</a><h1>高校化学｜公式・重要事項</h1><p id="desc" class="muted"></p><div id="content"></div><p><a href="./index.html">範囲選択へ戻る</a></p></main><script>const p=new URLSearchParams(location.search),sel=(p.get('units')||'').split(',').filter(Boolean);document.getElementById('desc').textContent='科目：'+(p.get('subject')==='advanced'?'化学':'化学基礎')+'。公式・用語・意味・条件を確認するページです。';document.getElementById('content').innerHTML="<article class=\"formula\"><h3>物質量</h3><p style=\"font-size:1.25rem;font-weight:800\">n = m / M</p><p><b>意味：</b>質量mをモル質量Mで割ると物質量nになる。</p><p><b>条件・注意：</b>mとMの単位をそろえる。</p><p><b>例・確認：</b>質量18 g、水のモル質量18 g/molなら1 mol。</p></article><article class=\"formula\"><h3>粒子数</h3><p style=\"font-size:1.25rem;font-weight:800\">N = nNₐ</p><p><b>意味：</b>物質量と粒子数の関係。</p><p><b>条件・注意：</b>Nₐはアボガドロ定数。</p><p><b>例・確認：</b>2 molなら粒子数は2Nₐ。</p></article><article class=\"formula\"><h3>モル濃度</h3><p style=\"font-size:1.25rem;font-weight:800\">c = n / V</p><p><b>意味：</b>溶液1 Lあたりの溶質の物質量。</p><p><b>条件・注意：</b>VはLで表す。</p><p><b>例・確認：</b>0.5 molを1 Lに溶かすと0.5 mol/L。</p></article><article class=\"formula\"><h3>希釈</h3><p style=\"font-size:1.25rem;font-weight:800\">c₁V₁ = c₂V₂</p><p><b>意味：</b>溶質の物質量が変わらない希釈の関係。</p><p><b>条件・注意：</b>濃度と体積の単位を統一する。</p><p><b>例・確認：</b>10倍に薄めると濃度は1/10。</p></article><article class=\"formula\"><h3>理想気体</h3><p style=\"font-size:1.25rem;font-weight:800\">pV = nRT</p><p><b>意味：</b>圧力・体積・物質量・絶対温度の関係。</p><p><b>条件・注意：</b>温度はK、単位系をそろえる。</p><p><b>例・確認：</b>温度を℃のまま代入しない。</p></article>";</script></body></html>
