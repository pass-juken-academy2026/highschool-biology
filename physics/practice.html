function start(list){let source=list||BANK.filter(q=>!units.length||units.includes(q[0]));if(!source.length){$("selected").textContent+=" ／ この範囲の問題は準備中です。範囲選択へ戻ってください。";return}
const mode=$("mode").value;if(!list&&mode==="basic")source=source.slice(0,Math.min(8,source.length));if(!list&&mode==="truefalse")source=TRUE_FALSE.filter(q=>!units.length||units.includes(q[0]));if(!list&&mode==="common")source=COMMON_TEST;if(!source.length&&mode!=="truefalse")source=(list||BANK.filter(q=>!units.length||units.includes(q[0])));if(!source.length){$("selected").textContent+=" ／ この範囲の正誤問題は準備中です。別の範囲か学習方法を選んでください。";return}questions=[...source].sort(()=>Math.random()-.5);idx=0;answers=[];locked=false;$("setup").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()}
function render(){locked=false;const q=questions[idx];$("counter").textContent=(idx+1)+" / "+questions.length;$("scoreLive").textContent="回答済み "+answers.length+"問";$("bar").style.width=(idx/questions.length*100)+"%";$("question").textContent=q[1];const stim=$('stimulus');if(stim){stim.textContent=q[5]||"";stim.classList.toggle("hidden",!q[5]);}$("choices").innerHTML="";q[2].forEach((t,i)=>{const b=document.createElement("button");b.className="choice";b.textContent=["A","B","C","D"][i]+"．"+t;b.addEventListener("click",()=>{if(locked)return;answers[idx]={selected:i};[...$("choices").children].forEach(x=>x.classList.remove("selected"));b.classList.add("selected")});$("choices").append(b)});$("feedback").classList.add("hidden");$("feedback").textContent="";$("check").disabled=false;$("next").disabled=true;$("next").textContent=idx===questions.length-1?"結果を見る":"次の問題 →"}
