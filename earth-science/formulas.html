<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高校地学｜重要事項</title><style>:root{color-scheme:dark;--bg:#071426;--panel:#10233d;--line:#294563;--txt:#edf5ff;--muted:#c3d5e9;--accent:#7bdcff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#14345a 0,transparent 48%),var(--bg);color:var(--txt);font:16px/1.65 system-ui,-apple-system,sans-serif}main{max-width:900px;margin:auto;padding:20px}h1{font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.2}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:15px 0}.grid,.units,.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.subject,.unit,.mode,.choice{display:flex;gap:10px;align-items:flex-start;padding:13px;border-radius:12px;background:#091a2e;border:1px solid #294563;color:var(--txt)}.subject{align-items:center;font-weight:800;cursor:pointer}.unit,.mode{cursor:pointer}.subject input,.unit input,.mode input{accent-color:var(--accent);width:20px;height:20px;flex-shrink:0;margin-top:3px}button,select{font:inherit;font-weight:800;border-radius:10px;padding:12px 16px;border:1px solid #438bb0;background:#17658b;color:#fff;cursor:pointer;min-height:46px}button{width:100%}button:disabled{opacity:.5;cursor:not-allowed}.pill{display:inline-block;padding:4px 10px;border-radius:99px;background:#203c5d;color:#c9eaff;font-size:.85rem}.error{color:#ffd0c8;min-height:1.4em}.formula,.explain{background:#091a2e;border-left:4px solid var(--accent);padding:13px;margin:12px 0;border-radius:8px}.choice{display:block;width:100%;text-align:left;margin:10px 0;cursor:pointer}.choice.selected{border:2px solid var(--accent)}.choice.correct{border:2px solid #5bd6a3}.choice.wrong{border:2px solid #ff9b9b}.hidden{display:none!important}.progress{height:8px;background:#263d58;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent);width:0}@media(max-width:560px){main{padding:12px}.panel{padding:14px}.grid,.units,.modes{grid-template-columns:1fr}}</style><style id="responsive-layout-polish">/* Responsive layout and touch-target polish; learning data unchanged. */*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:5rem}body{max-width:100%;overflow-wrap:anywhere}img,svg,canvas,video{max-width:100%;height:auto}button,input,select,textarea{font:inherit;max-width:100%;min-width:0}button,a,[role="button"]{touch-action:manipulation}button{min-height:42px}:where(button,a,input,select,textarea,[role="button"],[tabindex]):focus-visible{outline:3px solid #65c9f1;outline-offset:3px}@media(max-width:640px){body{font-size:16px;line-height:1.65}header,main{padding-left:max(16px,env(safe-area-inset-left))!important;padding-right:max(16px,env(safe-area-inset-right))!important}h1{font-size:clamp(1.55rem,7vw,2.25rem)!important;line-height:1.2}h2{font-size:clamp(1.15rem,5vw,1.45rem)}.grid,.cards,.subject-grid,.subjects,.menu-grid,.topic-grid,.cards-grid,.dashboard,.two-col,.three-col{grid-template-columns:minmax(0,1fr)!important}.card,.panel,.topic-card,.menu-card{min-width:0;overflow-wrap:anywhere}button{min-height:44px}.choices button{width:100%;text-align:left;white-space:normal}table{display:block;max-width:100%;overflow-x:auto}pre,code{overflow-wrap:anywhere;white-space:pre-wrap}input,select,textarea{font-size:16px}}</style></head><body><main><a href="./index.html">← 科目・範囲選択へ戻る</a><h1>高校地学｜公式・重要事項</h1><p id="desc" class="muted"></p><div id="content"></div><p><a href="./index.html">範囲選択へ戻る</a></p></main><script>const p=new URLSearchParams(location.search),sel=(p.get('units')||'').split(',').filter(Boolean);document.getElementById('desc').textContent='科目：'+(p.get('subject')==='advanced'?'地学':'地学基礎')+'。公式・用語・意味・条件を確認するページです。';document.getElementById('content').innerHTML="<article class=\"formula\"><h3>震源距離の推定</h3><p style=\"font-size:1.25rem;font-weight:800\">距離 ≈ 波の速さ × 到達時間</p><p><b>意味：</b>波の到達時刻から伝わった距離を考える。</p><p><b>条件・注意：</b>震源時と観測時、P波・S波の速さを区別する。</p><p><b>例・確認：</b>単一波の時間だけでは震源時が必要な場合がある。</p></article><article class=\"formula\"><h3>年周視差</h3><p style=\"font-size:1.25rem;font-weight:800\">距離(pc) = 1 / 視差(秒角)</p><p><b>意味：</b>年周視差から近傍恒星までの距離を求める。</p><p><b>条件・注意：</b>視差は秒角、距離はパーセクで表す。</p><p><b>例・確認：</b>視差0.1秒角なら10 pc。</p></article><article class=\"formula\"><h3>ケプラー第3法則</h3><p style=\"font-size:1.25rem;font-weight:800\">T² ∝ a³</p><p><b>意味：</b>同じ中心天体を回る天体の公転周期と軌道長半径の関係。</p><p><b>条件・注意：</b>同じ中心天体の軌道同士で比較する。</p><p><b>例・確認：</b>軌道半径が大きい惑星ほど周期が長い。</p></article><article class=\"formula\"><h3>相対湿度</h3><p style=\"font-size:1.25rem;font-weight:800\">相対湿度 = 実際の水蒸気量 / 飽和水蒸気量 × 100%</p><p><b>意味：</b>空気が含む水蒸気量を飽和量と比較する。</p><p><b>条件・注意：</b>温度によって飽和水蒸気量が変わる。</p><p><b>例・確認：</b>同じ水蒸気量でも気温低下で湿度が上がる。</p></article><article class=\"formula\"><h3>地層の重なり</h3><p style=\"font-size:1.25rem;font-weight:800\">乱されていない地層は下位ほど古い</p><p><b>意味：</b>地層の上下関係から堆積順序を推定する。</p><p><b>条件・注意：</b>褶曲・断層・逆転がある場合はその影響を考慮する。</p><p><b>例・確認：</b>上下が逆転した地層には単純適用できない。</p></article>";</script></body></html>
