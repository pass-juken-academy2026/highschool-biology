<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高校生物｜重要事項</title><style>:root{color-scheme:dark;--bg:#071426;--panel:#10233d;--line:#294563;--txt:#edf5ff;--muted:#c3d5e9;--accent:#7bdcff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#14345a 0,transparent 48%),var(--bg);color:var(--txt);font:16px/1.65 system-ui,-apple-system,sans-serif}main{max-width:900px;margin:auto;padding:20px}h1{font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.2}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:15px 0}.grid,.units,.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.subject,.unit,.mode,.choice{display:flex;gap:10px;align-items:flex-start;padding:13px;border-radius:12px;background:#091a2e;border:1px solid #294563;color:var(--txt)}.subject{align-items:center;font-weight:800;cursor:pointer}.unit,.mode{cursor:pointer}.subject input,.unit input,.mode input{accent-color:var(--accent);width:20px;height:20px;flex-shrink:0;margin-top:3px}button,select{font:inherit;font-weight:800;border-radius:10px;padding:12px 16px;border:1px solid #438bb0;background:#17658b;color:#fff;cursor:pointer;min-height:46px}button{width:100%}button:disabled{opacity:.5;cursor:not-allowed}.pill{display:inline-block;padding:4px 10px;border-radius:99px;background:#203c5d;color:#c9eaff;font-size:.85rem}.error{color:#ffd0c8;min-height:1.4em}.formula,.explain{background:#091a2e;border-left:4px solid var(--accent);padding:13px;margin:12px 0;border-radius:8px}.choice{display:block;width:100%;text-align:left;margin:10px 0;cursor:pointer}.choice.selected{border:2px solid var(--accent)}.choice.correct{border:2px solid #5bd6a3}.choice.wrong{border:2px solid #ff9b9b}.hidden{display:none!important}.progress{height:8px;background:#263d58;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent);width:0}@media(max-width:560px){main{padding:12px}.panel{padding:14px}.grid,.units,.modes{grid-template-columns:1fr}}</style><style id="responsive-layout-polish">/* Responsive layout and touch-target polish; learning data unchanged. */*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:5rem}body{max-width:100%;overflow-wrap:anywhere}img,svg,canvas,video{max-width:100%;height:auto}button,input,select,textarea{font:inherit;max-width:100%;min-width:0}button,a,[role="button"]{touch-action:manipulation}button{min-height:42px}:where(button,a,input,select,textarea,[role="button"],[tabindex]):focus-visible{outline:3px solid #65c9f1;outline-offset:3px}@media(max-width:640px){body{font-size:16px;line-height:1.65}header,main{padding-left:max(16px,env(safe-area-inset-left))!important;padding-right:max(16px,env(safe-area-inset-right))!important}h1{font-size:clamp(1.55rem,7vw,2.25rem)!important;line-height:1.2}h2{font-size:clamp(1.15rem,5vw,1.45rem)}.grid,.cards,.subject-grid,.subjects,.menu-grid,.topic-grid,.cards-grid,.dashboard,.two-col,.three-col{grid-template-columns:minmax(0,1fr)!important}.card,.panel,.topic-card,.menu-card{min-width:0;overflow-wrap:anywhere}button{min-height:44px}.choices button{width:100%;text-align:left;white-space:normal}table{display:block;max-width:100%;overflow-x:auto}pre,code{overflow-wrap:anywhere;white-space:pre-wrap}input,select,textarea{font-size:16px}}</style></head><body><main><a href="./index.html">← 科目・範囲選択へ戻る</a><h1>高校生物｜公式・重要事項</h1><p id="desc" class="muted"></p><div id="content"></div><p><a href="./index.html">範囲選択へ戻る</a></p></main><script>const p=new URLSearchParams(location.search),sel=(p.get('units')||'').split(',').filter(Boolean);document.getElementById('desc').textContent='科目：'+(p.get('subject')==='advanced'?'生物':'生物基礎')+'。公式・用語・意味・条件を確認するページです。';document.getElementById('content').innerHTML="<article class=\"formula\"><h3>DNAの塩基対</h3><p style=\"font-size:1.25rem;font-weight:800\">A–T、G–C</p><p><b>意味：</b>DNAでは塩基が相補的に対合する。</p><p><b>条件・注意：</b>RNAではTの代わりにUを使う。</p><p><b>例・確認：</b>DNAの一方がAなら相補鎖はT。</p></article><article class=\"formula\"><h3>遺伝子発現</h3><p style=\"font-size:1.25rem;font-weight:800\">DNA → RNA → タンパク質</p><p><b>意味：</b>転写でRNA、翻訳でタンパク質が合成される。</p><p><b>条件・注意：</b>RNAの種類や細胞内の過程を区別する。</p><p><b>例・確認：</b>転写と翻訳を同じ過程としない。</p></article><article class=\"formula\"><h3>光合成</h3><p style=\"font-size:1.25rem;font-weight:800\">CO₂ + H₂O → 有機物 + O₂（概略）</p><p><b>意味：</b>光エネルギーを使って有機物を合成する。</p><p><b>条件・注意：</b>実際の反応は複数段階で進む。</p><p><b>例・確認：</b>光合成と細胞呼吸の物質収支を比較する。</p></article><article class=\"formula\"><h3>細胞呼吸</h3><p style=\"font-size:1.25rem;font-weight:800\">有機物 + O₂ → CO₂ + H₂O（概略）</p><p><b>意味：</b>有機物を分解して利用可能なエネルギーを得る。</p><p><b>条件・注意：</b>ATP合成など複数段階を含む。</p><p><b>例・確認：</b>光合成と逆向きの物質変化として整理する。</p></article><article class=\"formula\"><h3>個体群成長</h3><p style=\"font-size:1.25rem;font-weight:800\">増加率は出生・死亡・移入・移出で変化</p><p><b>意味：</b>個体群の数は複数の要因で変わる。</p><p><b>条件・注意：</b>環境収容力など条件を確認する。</p><p><b>例・確認：</b>資源制限があると増加が抑えられる。</p></article>";document.getElementById('content').insertAdjacentHTML('beforeend', '<article class="formula"><h3>ハーディ・ワインベルグの法則</h3><p style="font-size:1.25rem;font-weight:800">p² + 2pq + q² = 1（p + q = 1）</p><p><b>意味：</b>集団内の対立遺伝子頻度と遺伝子型頻度の関係を表す。</p><p><b>条件・注意：</b>大きな集団、無作為交配、突然変異・移住・自然選択などの影響がないという理想条件を考える。</p><p><b>例・確認：</b>p=0.7、q=0.3ならヘテロ接合体の頻度は2pq=0.42。</p></article><article class="formula"><h3>組換え価</h3><p style="font-size:1.25rem;font-weight:800">組換え価 = 組換え型の個体数 / 全個体数 × 100%</p><p><b>意味：</b>遺伝子間の組換えが観察された割合を表す。</p><p><b>条件・注意：</b>適切な交配実験の結果を数え、組換え型と親型を区別する。</p><p><b>例・確認：</b>1000個体中120個体が組換え型なら12％。</p></article><article class="formula"><h3>純一次生産量</h3><p style="font-size:1.25rem;font-weight:800">純一次生産量 = 総一次生産量 − 呼吸量</p><p><b>意味：</b>生産者が光合成などで得た有機物のうち、呼吸で消費した分を除いた量。</p><p><b>条件・注意：</b>同じ期間・同じ面積など、比較する量の条件をそろえる。</p><p><b>例・確認：</b>総一次生産量が100、呼吸量が40なら純一次生産量は60。</p></article><article class="formula"><h3>個体群密度</h3><p style="font-size:1.25rem;font-weight:800">個体群密度 = 個体数 / 調査面積</p><p><b>意味：</b>一定面積あたりに存在する個体数。</p><p><b>条件・注意：</b>調査面積や調査方法をそろえて比較する。</p><p><b>例・確認：</b>200 m²に80個体なら0.4個体/m²。</p></article><article class="formula"><h3>呼吸商</h3><p style="font-size:1.25rem;font-weight:800">呼吸商 = 放出したCO₂量 / 吸収したO₂量</p><p><b>意味：</b>細胞呼吸で放出される二酸化炭素量と吸収される酸素量の比。</p><p><b>条件・注意：</b>気体の量は同じ条件で比較する。基質や代謝経路により値が異なる。</p><p><b>例・確認：</b>CO₂を6、O₂を6の割合で交換する場合、呼吸商は1。</p></article><article class="formula"><h3>個体群の相対増加率</h3><p style="font-size:1.25rem;font-weight:800">相対増加率 = (N₂ − N₁) / N₁ × 100%</p><p><b>意味：</b>初めの個体数に対する増減の割合。</p><p><b>条件・注意：</b>N₁は0より大きく、比較する期間を明確にする。</p><p><b>例・確認：</b>100個体から120個体なら増加率は20％。</p></article>');
</script></body></html>
