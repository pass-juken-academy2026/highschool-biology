function start(list){stopCommonExamTimer();let source=list||BANK.filter(q=>!units.length||units.includes(q[0]));const mode=$('mode').value;if(!list&&mode==='basic')source=source.slice(0,Math.min(8,source.length));if(!list&&mode==='truefalse')source=TRUE_FALSE.filter(q=>!units.length||units.includes(q[0]));if(!list&&mode==='common')source=COMMON_TEST;if(!list&&mode==='mock')source=MOCK_TEST;if(!source.length&&mode!=='truefalse'&&mode!=='common')source=list||BANK.filter(q=>!units.length||units.includes(q[0]));if(!source.length){$('feedback').textContent='この範囲・学習方法に対応する問題はありません。別の範囲か学習方法を選んでください。';$('feedback').classList.remove('hidden');return}questions=(!list&&mode==="common")?[...source]:[...source].sort(()=>Math.random()-.5);idx=0;answers=[];$('setup').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render();if(!list&&mode==="common")startCommonExamTimer()}
function render(){locked=false;const q=questions[idx];$('counter').textContent=(idx+1)+' / '+questions.length;$('bar').style.width=(idx/questions.length*100)+'%';$('question').textContent=q[1];const stim=$('stimulus');stim.replaceChildren();if(q[5]){stim.classList.remove('hidden');const passage=document.createElement('p');passage.textContent=q[5];passage.style.whiteSpace='pre-wrap';stim.append(passage);if(q[6]){const chart=q[6],wrap=document.createElement('div'),head=document.createElement('strong'),svg=document.createElementNS('http://www.w3.org/2000/svg','svg');head.textContent=chart.title;wrap.append(head);svg.setAttribute('viewBox','0 0 340 220');svg.setAttribute('role','img');svg.setAttribute('aria-label',chart.title);svg.style.width='100%';svg.style.maxWidth='520px';svg.style.display='block';const line=(x1,y1,x2,y2)=>{const e=document.createElementNS(svg.namespaceURI,'line');for(const [k,v] of Object.entries({x1,y1,x2,y2,stroke:'#64748b','stroke-width':'1'}))e.setAttribute(k,v);svg.append(e)};line(42,18,42,178);line(42,178,320,178);const vals=chart.values,max=Math.max(...vals)*1.15||1;const pts=vals.map((v,i)=>[52+i*(250/Math.max(1,vals.length-1)),178-v/max*140]);if(chart.type==='bar'){pts.forEach(pt=>{const rect=document.createElementNS(svg.namespaceURI,'rect');rect.setAttribute('x',pt[0]-12);rect.setAttribute('y',pt[1]);rect.setAttribute('width','24');rect.setAttribute('height',178-pt[1]);rect.setAttribute('fill','#94a3b8');svg.append(rect)})}else{const poly=document.createElementNS(svg.namespaceURI,'polyline');poly.setAttribute('points',pts.map(p=>p.join(',')).join(' '));poly.setAttribute('fill','none');poly.setAttribute('stroke','#2563eb');poly.setAttribute('stroke-width','3');svg.append(poly);pts.forEach(pt=>{const c=document.createElementNS(svg.namespaceURI,'circle');c.setAttribute('cx',pt[0]);c.setAttribute('cy',pt[1]);c.setAttribute('r','4');c.setAttribute('fill','#2563eb');svg.append(c)})}chart.labels.forEach((lab,i)=>{const t=document.createElementNS(svg.namespaceURI,'text');t.setAttribute('x',pts[i][0]);t.setAttribute('y','195');t.setAttribute('font-size','10');t.setAttribute('text-anchor','middle');t.textContent=lab;svg.append(t)});const xl=document.createElementNS(svg.namespaceURI,'text');xl.setAttribute('x','180');xl.setAttribute('y','215');xl.setAttribute('font-size','11');xl.setAttribute('text-anchor','middle');xl.textContent=chart.xLabel;svg.append(xl);const yl=document.createElementNS(svg.namespaceURI,'text');yl.setAttribute('x','8');yl.setAttribute('y','95');yl.setAttribute('font-size','10');yl.textContent=chart.yLabel;svg.append(yl);wrap.append(svg);const data=document.createElement('p');data.textContent='データ：'+chart.labels.map((l,i)=>l+'：'+vals[i]).join('、');wrap.append(data);stim.append(wrap)}}else{stim.classList.add('hidden')}q[2].forEach((v,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'．'+v;b.addEventListener('click',()=>{if(locked)return;answers[idx]=answers[idx]||{};answers[idx].selected=i;[...$('choices').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});$('choices').append(b)});$('feedback').classList.add('hidden');$('check').disabled=false;$('next').disabled=true;$('next').textContent=idx===questions.length-1?'結果を見る':'次の問題 →'}
$('start').addEventListener('click',()=>start());$('check').addEventListener('click',()=>{if(locked)return;if(!answers[idx]||answers[idx].selected===undefined){$('feedback').textContent='選択肢を選んでください。';$('feedback').classList.remove('hidden');return}locked=true;const q=questions[idx],a=answers[idx];a.correct=a.selected===q[3];[...$('choices').children].forEach((b,i)=>{b.disabled=true;if(i===q[3])b.classList.add('correct');if(i===a.selected&&i!==q[3])b.classList.add('wrong')});$('feedback').textContent=(a.correct?'正解！':'不正解。正解は'+String.fromCharCode(65+q[3])+'。')+q[4];$('feedback').classList.remove('hidden');$('check').disabled=true;$('next').disabled=false});
$('next').addEventListener('click',()=>{if(idx<questions.length-1){idx++;render()}else finish()});
function finish(){stopCommonExamTimer(); $('quiz').classList.add('hidden');$('result').classList.remove('hidden');const good=answers.filter(a=>a&&a.correct).length,wrong=questions.map((q,i)=>({q,a:answers[i]})).filter(x=>!x.a||!x.a.correct);$('summary').textContent=good+' / '+questions.length+'問正解（正答率 '+Math.round(good/questions.length*100)+'%）';const counts={};wrong.forEach(x=>counts[allNames[x.q[0]]||x.q[0]]=(counts[allNames[x.q[0]]||x.q[0]]||0)+1);$('analysis').textContent=wrong.length?'復習が必要な範囲：'+Object.entries(counts).map(([k,v])=>k+'（'+v+'問）').join('、'):'全問正解！用語や条件も説明できるか確認しよう。';$('missed').innerHTML=wrong.map(x=>'<article class="explain"><b>'+x.q[1]+'</b><p>正解：'+x.q[2][x.q[3]]+'</p><p>'+x.q[4]+'</p></article>').join('')||'間違えた問題はありません。';$('review').disabled=!wrong.length;$('review').onclick=()=>start(wrong.map(x=>x.q));$('again').onclick=()=>{$('setup').classList.remove('hidden');$('result').classList.add('hidden')}}
$('review').disabled=true;
</script></body></html>
