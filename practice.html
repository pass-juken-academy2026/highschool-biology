const p=new URLSearchParams(location.search),subject=p.get('subject')||'foundation',units=(p.get('units')||'').split(',').filter(Boolean),initial=p.get('mode')||'basic',BANK=[["f0","細胞膜の主な働きは？",["細胞内外の物質移動を調節する","遺伝情報を必ず分解する","光だけを作る","細胞を常に動かす"],0,"細胞膜は物質の出入りを選択的に調節する。"],["f1","DNAの塩基対の組み合わせは？",["A-G、C-T","A-T、G-C","A-C、G-T","A-U、G-Cのみ"],1,"DNAではAとT、GとCが相補的に対合する。"],["f2","体内環境を一定範囲に保つ仕組みは？",["恒常性（ホメオスタシス）","蒸発だけ","進化だけ","光合成"],0,"神経系や内分泌系などが関わって体内環境を調節する。"],["f3","抗体を主に産生する細胞は？",["赤血球","形質細胞","血小板","神経細胞"],1,"B細胞が分化した形質細胞が抗体を産生する。"],["a0","酵素の一般的な働きは？",["活性化エネルギーを下げる","反応後に必ず消費される","全反応を停止する","平衡を必ず一方向へ移す"],0,"酵素は触媒として反応を促進し、基質特異性を示す。"],["a1","細胞呼吸でエネルギーを取り出す際に重要な分子は？",["ATP","セルロースのみ","抗体のみ","メラニンのみ"],0,"細胞呼吸で得たエネルギーはATPの合成などに利用される。"],["a2","転写で作られるものは？",["DNAからRNA","タンパク質からDNA","脂質からRNA","ATPから染色体"],0,"転写ではDNAの塩基配列をもとにRNAが合成される。"],["a3","独立の法則がそのまま適用できない代表例は？",["異なる染色体上の遺伝子","連鎖した遺伝子","完全に独立な遺伝子","無関係な形質"],1,"同じ染色体上で連鎖している遺伝子は独立に分配されない場合がある。"],["a4","反射の基本的な説明として正しいのは？",["刺激に対する無意識の反応","必ず学習して得る行動","植物だけにある現象","遺伝情報がない状態"],0,"反射は刺激に対する比較的すばやい不随意反応。"],["a5","植物ホルモンのオーキシンが関係する現象は？",["屈光性","血液凝固","抗体産生","腎臓でのろ過のみ"],0,"オーキシンは細胞伸長などを通じて屈光性に関わる。"],["a6","生態系でエネルギーが移動するとき正しいのは？",["食物連鎖の各段階で一部が熱として失われる","エネルギーが完全に循環する","分解者は関係しない","生産者は必ず動物"],0,"物質は循環するが、エネルギーは各段階で熱として散逸する。"],["a7","自然選択について正しい説明は？",["環境に適した遺伝的変異が世代を通じて増えることがある","個体が必要に応じて遺伝子を自由に変える","全ての個体が同時に同じ変異を得る","進化は必ず複雑化する"],0,"遺伝的変異と繁殖成功の差が集団の形質頻度を変化させる。"],["f4","【生態系】生態系で生産者にあたるものとして適切なのは？",["光合成を行う植物","草食動物だけ","菌類だけ","すべての消費者"],0,"生産者は光合成などによって無機物から有機物を合成する。"],["a1","【実験考察】アミラーゼの反応速度に対する温度の影響を調べる。温度以外の条件をそろえる方法は？",["温度だけを変え、pHと基質量は同じにする","温度とpHと基質量を全部変える","反応時間を試料ごとに変える","結果に合う試料だけを使う"],0,"温度の影響を調べるには、独立変数を温度にし、pH・基質量・反応時間などをそろえて比較する。"],["a3","【共通テスト】完全優性で、ヘテロ接合体 Aa 同士を交配したとき、表現型の比として期待されるものは？",["優性：劣性＝1：1","優性：劣性＝3：1","優性：劣性＝1：3","すべて劣性"],1,"Aa×Aa の遺伝子型比は AA:Aa:aa＝1:2:1。完全優性なら優性形質は3、劣性形質は1の割合になる。"],["a6","【資料読解】光の強さを上げると、植物の酸素発生量が増えた後にほぼ一定になった。この結果から考えられることは？",["光以外の要因が光合成速度を制限し始めた可能性がある","光の強さを上げるほど必ず無限に増える" const COMMON_TEST=[["f4","光の強さを0から2へ上げたときの結果として適切なのは？",["酸素発生量は増加した","酸素発生量は必ず減少した","変化はなかった","光合成は停止した"],0,"図1では光の強さ0から2にかけて酸素発生量が増加している。","【大問1　光の強さと光合成】\nある植物を用い、二酸化炭素濃度と温度を一定に保って光の強さを変え、一定時間あたりの酸素発生量を測定した。\n\n図1は測定結果を示す。光の強さが弱い範囲では酸素発生量が増加したが、強い範囲では増加が小さくなった。以下の設問に答えよ。",{"title":"図1　光の強さと酸素発生量","xLabel":"光の強さ（相対値）","yLabel":"酸素発生量（相対値）","labels":["0","1","2","3","4","5"],"values":[0,2,4,5,5.5,5.6],"type":"line"}],["f4","光の強さを3から5へ上げても増加が小さい理由として最も適切なのは？",["光以外の要因が光合成速度を制限している可能性がある","光合成では光を利用しない","植物が酸素を一切発生しなくなる","二酸化炭素濃度が必ずゼロになる"],0,"光が十分になると、二酸化炭素濃度や温度など別の要因が制限要因になることがある。","【大問1　光の強さと光合成】\nある植物を用い、二酸化炭素濃度と温度を一定に保って光の強さを変え、一定時間あたりの酸素発生量を測定した。\n\n図1は測定結果を示す。光の強さが弱い範囲では酸素発生量が増加したが、強い範囲では増加が小さくなった。以下の設問に答えよ。",{"title":"図1　光の強さと酸素発生量","xLabel":"光の強さ（相対値）","yLabel":"酸素発生量（相対値）","labels":["0","1","2","3","4","5"],"values":[0,2,4,5,5.5,5.6],"type":"line"}],["f4","この実験で光の影響を調べるため、一定に保つ条件として最も適切なのは？",["二酸化炭素濃度と温度","光の強さだけを毎回変える以外は記録しない","植物の種類と葉の量を測定ごとに変える","測定時間を結果に合わせて変える"],0,"光の強さの影響を比較するため、二酸化炭素濃度・温度・植物量・測定時間などをそろえる。","【大問1　光の強さと光合成】\nある植物を用い、二酸化炭素濃度と温度を一定に保って光の強さを変え、一定時間あたりの酸素発生量を測定した。\n\n図1は測定結果を示す。光の強さが弱い範囲では酸素発生量が増加したが、強い範囲では増加が小さくなった。以下の設問に答えよ。",{"title":"図1　光の強さと酸素発生量","xLabel":"光の強さ（相対値）","yLabel":"酸素発生量（相対値）","labels":["0","1","2","3","4","5"],"values":[0,2,4,5,5.5,5.6],"type":"line"}]];

$('mode').value=['basic','truefalse','common','mock'].includes(initial)?initial:'basic';$('modeInfo').textContent=modes[$('mode').value];$('mode').addEventListener('change',()=>{$('modeInfo').textContent=modes[$('mode').value]});
function start(list){let source=list||BANK.filter(q=>!units.length||units.includes(q[0]));const mode=$('mode').value;if(!list&&mode==='basic')source=source.slice(0,Math.min(8,source.length));if(!list&&mode==='truefalse')source=TRUE_FALSE.filter(q=>!units.length||units.includes(q[0]));if(!list&&mode==='common')source=COMMON_TEST;if(!list&&mode==='mock')source=MOCK_TEST;if(!source.length&&mode!=='truefalse'&&mode!=='common')source=list||BANK.filter(q=>!units.length||units.includes(q[0]));if(!source.length){$('feedback').textContent='この範囲・学習方法に対応する問題はありません。別の範囲か学習方法を選んでください。';$('feedback').classList.remove('hidden');return}questions=[...source].sort(()=>Math.random()-.5);idx=0;answers=[];$('setup').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}
function render(){locked=false;const q=questions[idx];$('counter').textContent=(idx+1)+' / '+questions.length;$('bar').style.width=(idx/questions.length*100)+'%';$('question').textContent=q[1];const stim=$('stimulus');stim.replaceChildren();if(q[5]){stim.classList.remove('hidden');const passage=document.createElement('p');passage.textContent=q[5];passage.style.whiteSpace='pre-wrap';stim.append(passage);if(q[6]){const chart=q[6],wrap=document.createElement('div'),head=document.createElement('strong'),svg=document.createElementNS('http://www.w3.org/2000/svg','svg');head.textContent=chart.title;wrap.append(head);svg.setAttribute('viewBox','0 0 340 220');svg.setAttribute('role','img');svg.setAttribute('aria-label',chart.title);svg.style.width='100%';svg.style.maxWidth='520px';svg.style.display='block';const line=(x1,y1,x2,y2)=>{const e=document.createElementNS(svg.namespaceURI,'line');for(const [k,v] of Object.entries({x1,y1,x2,y2,stroke:'#64748b','stroke-width':'1'}))e.setAttribute(k,v);svg.append(e)};line(42,18,42,178);line(42,178,320,178);const vals=chart.values,max=Math.max(...vals)*1.15||1;const pts=vals.map((v,i)=>[52+i*(250/Math.max(1,vals.length-1)),178-v/max*140]);if(chart.type==='bar'){pts.forEach(pt=>{const rect=document.createElementNS(svg.namespaceURI,'rect');rect.setAttribute('x',pt[0]-12);rect.setAttribute('y',pt[1]);rect.setAttribute('width','24');rect.setAttribute('height',178-pt[1]);rect.setAttribute('fill','#94a3b8');svg.append(rect)})}else{const poly=document.createElementNS(svg.namespaceURI,'polyline');poly.setAttribute('points',pts.map(p=>p.join(',')).join(' '));poly.setAttribute('fill','none');poly.setAttribute('stroke','#2563eb');poly.setAttribute('stroke-width','3');svg.append(poly);pts.forEach(pt=>{const c=document.createElementNS(svg.namespaceURI,'circle');c.setAttribute('cx',pt[0]);c.setAttribute('cy',pt[1]);c.setAttribute('r','4');c.setAttribute('fill','#2563eb');svg.append(c)})}chart.labels.forEach((lab,i)=>{const t=document.createElementNS(svg.namespaceURI,'text');t.setAttribute('x',pts[i][0]);t.setAttribute('y','195');t.setAttribute('font-size','10');t.setAttribute('text-anchor','middle');t.textContent=lab;svg.append(t)});const xl=document.createElementNS(svg.namespaceURI,'text');xl.setAttribute('x','180');xl.setAttribute('y','215');xl.setAttribute('font-size','11');xl.setAttribute('text-anchor','middle');xl.textContent=chart.xLabel;svg.append(xl);const yl=document.createElementNS(svg.namespaceURI,'text');yl.setAttribute('x','8');yl.setAttribute('y','95');yl.setAttribute('font-size','10');yl.textContent=chart.yLabel;svg.append(yl);wrap.append(svg);const data=document.createElement('p');data.textContent='データ：'+chart.labels.map((l,i)=>l+'：'+vals[i]).join('、');wrap.append(data);stim.append(wrap)}}else{stim.classList.add('hidden')}q[2].forEach((v,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'．'+v;b.addEventListener('click',()=>{if(locked)return;answers[idx]=answers[idx]||{};answers[idx].selected=i;[...$('choices').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});$('choices').append(b)});$('feedback').classList.add('hidden');$('check').disabled=false;$('next').disabled=true;$('next').textContent=idx===questions.length-1?'結果を見る':'次の問題 →'}
$('start').addEventListener('click',()=>start());$('check').addEventListener('click',()=>{if(locked)return;if(!answers[idx]||answers[idx].selected===undefined){$('feedback').textContent='選択肢を選んでください。';$('feedback').classList.remove('hidden');return}locked=true;const q=questions[idx],a=answers[idx];a.correct=a.selected===q[3];[...$('choices').children].forEach((b,i)=>{b.disabled=true;if(i===q[3])b.classList.add('correct');if(i===a.selected&&i!==q[3])b.classList.add('wrong')});$('feedback').textContent=(a.correct?'正解！':'不正解。正解は'+String.fromCharCode(65+q[3])+'。')+q[4];$('feedback').classList.remove('hidden');$('check').disabled=true;$('next').disabled=false});
$('next').addEventListener('click',()=>{if(idx<questions.length-1){idx++;render()}else finish()});
function finish(){ $('quiz').classList.add('hidden');$('result').classList.remove('hidden');const good=answers.filter(a=>a&&a.correct).length,wrong=questions.map((q,i)=>({q,a:answers[i]})).filter(x=>!x.a||!x.a.correct);$('summary').textContent=good+' / '+questions.length+'問正解（正答率 '+Math.round(good/questions.length*100)+'%）';const counts={};wrong.forEach(x=>counts[allNames[x.q[0]]||x.q[0]]=(counts[allNames[x.q[0]]||x.q[0]]||0)+1);$('analysis').textContent=wrong.length?'復習が必要な範囲：'+Object.entries(counts).map(([k,v])=>k+'（'+v+'問）').join('、'):'全問正解！用語や条件も説明できるか確認しよう。';$('missed').innerHTML=wrong.map(x=>'<article class="explain"><b>'+x.q[1]+'</b><p>正解：'+x.q[2][x.q[3]]+'</p><p>'+x.q[4]+'</p></article>').join('')||'間違えた問題はありません。';$('review').disabled=!wrong.length;$('review').onclick=()=>start(wrong.map(x=>x.q));$('again').onclick=()=>{$('setup').classList.remove('hidden');$('result').classList.add('hidden')}}
$('review').disabled=true;
</script></body></html>
