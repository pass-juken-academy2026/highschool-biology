<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高校化学｜演習・弱点分析</title><style>:root{color-scheme:dark;--bg:#071426;--panel:#10233d;--line:#294563;--txt:#edf5ff;--muted:#c3d5e9;--accent:#7bdcff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#14345a 0,transparent 48%),var(--bg);color:var(--txt);font:16px/1.65 system-ui,-apple-system,sans-serif}main{max-width:900px;margin:auto;padding:20px}h1{font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.2}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:15px 0}.grid,.units,.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.subject,.unit,.mode,.choice{display:flex;gap:10px;align-items:flex-start;padding:13px;border-radius:12px;background:#091a2e;border:1px solid #294563;color:var(--txt)}.subject{align-items:center;font-weight:800;cursor:pointer}.unit,.mode{cursor:pointer}.subject input,.unit input,.mode input{accent-color:var(--accent);width:20px;height:20px;flex-shrink:0;margin-top:3px}button,select{font:inherit;font-weight:800;border-radius:10px;padding:12px 16px;border:1px solid #438bb0;background:#17658b;color:#fff;cursor:pointer;min-height:46px}button{width:100%}button:disabled{opacity:.5;cursor:not-allowed}.pill{display:inline-block;padding:4px 10px;border-radius:99px;background:#203c5d;color:#c9eaff;font-size:.85rem}.error{color:#ffd0c8;min-height:1.4em}.formula,.explain{background:#091a2e;border-left:4px solid var(--accent);padding:13px;margin:12px 0;border-radius:8px}.choice{display:block;width:100%;text-align:left;margin:10px 0;cursor:pointer}.choice.selected{border:2px solid var(--accent)}.choice.correct{border:2px solid #5bd6a3}.choice.wrong{border:2px solid #ff9b9b}.hidden{display:none!important}.progress{height:8px;background:#263d58;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent);width:0}@media(max-width:560px){main{padding:12px}.panel{padding:14px}.grid,.units,.modes{grid-template-columns:1fr}}</style><style id="responsive-layout-polish">/* Responsive layout and touch-target polish; learning data unchanged. */*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:5rem}body{max-width:100%;overflow-wrap:anywhere}img,svg,canvas,video{max-width:100%;height:auto}button,input,select,textarea{font:inherit;max-width:100%;min-width:0}button,a,[role="button"]{touch-action:manipulation}button{min-height:42px}:where(button,a,input,select,textarea,[role="button"],[tabindex]):focus-visible{outline:3px solid #65c9f1;outline-offset:3px}@media(max-width:640px){body{font-size:16px;line-height:1.65}header,main{padding-left:max(16px,env(safe-area-inset-left))!important;padding-right:max(16px,env(safe-area-inset-right))!important}h1{font-size:clamp(1.55rem,7vw,2.25rem)!important;line-height:1.2}h2{font-size:clamp(1.15rem,5vw,1.45rem)}.grid,.cards,.subject-grid,.subjects,.menu-grid,.topic-grid,.cards-grid,.dashboard,.two-col,.three-col{grid-template-columns:minmax(0,1fr)!important}.card,.panel,.topic-card,.menu-card{min-width:0;overflow-wrap:anywhere}button{min-height:44px}.choices button{width:100%;text-align:left;white-space:normal}table{display:block;max-width:100%;overflow-x:auto}pre,code{overflow-wrap:anywhere;white-space:pre-wrap}input,select,textarea{font-size:16px}}</style></head><body><main><a href="./index.html">← 科目・範囲選択へ戻る</a><h1>高校化学｜演習ラボ</h1><p id="selected" class="muted"></p><section class="panel" id="setup"><h2>演習方法</h2><label for="mode">学習方法</label><br><select id="mode"><option value="basic">基本問題</option><option value="truefalse">正誤問題</option><option value="common">共通テスト型演習</option><option value="mock">模擬テスト・弱点分析</option></select><p id="modeInfo" class="muted"></p><button id="start">演習を開始</button></section><section class="panel hidden" id="quiz"><span id="counter" class="pill"></span><div class="progress"><span id="bar"></span></div><h2 id="question"></h2><div id="choices"></div><div id="feedback" class="explain hidden" role="status" aria-live="polite"></div><button id="check">解答する</button><p><button id="next" disabled>次へ</button></p></section><section class="panel hidden" id="result"><h2>結果・弱点分析</h2><p id="summary"></p><p id="analysis" class="muted"></p><div id="missed"></div><button id="review">間違えた問題を復習</button><p><button id="again">もう一度挑戦</button></p></section></main><script>
const p=new URLSearchParams(location.search),subject=p.get('subject')||'foundation',units=(p.get('units')||'').split(',').filter(Boolean),initial=p.get('mode')||'basic',BANK=[["f0","元素と単体の違いは？",["元素は物質の種類、単体は1種類の元素からできた純物質","元素と単体は同じ意味","単体は必ず混合物","元素は必ず気体"],0,"元素は構成する原子の種類、単体は1種類の元素からなる純物質。"],["f1","物質量 n を求める式は？",["n=M/m","n=m/M","n=mM","n=V/m"],1,"物質量は質量mをモル質量Mで割る。"],["f2","酸と塩基の中和で基本的に生じるものは？",["金属と酸素","塩と水","水素と炭素","必ず二酸化炭素"],1,"酸と塩基が反応して塩と水を生じるのが中和の基本。"],["f3","酸化で一般に起こる変化は？",["電子を受け取る","酸化数が下がる","電子を失う","必ず酸素が外れる"],2,"酸化は電子を失うこと、または酸化数が増加すること。"],["a0","気体の温度を計算式に入れる際の単位は？",["℃","K","どちらでもよい","mol"],1,"気体の状態方程式では絶対温度Kを使う。"],["a1","理想気体の状態方程式は？",["pV=nRT","p=nVRT","pV=RT/n","pT=nRV"],0,"pV=nRT。圧力・体積・物質量・温度の単位をそろえる。"],["a2","反応速度に影響する要因は？",["濃度や温度","元素記号の字体だけ","容器の色だけ","反応式の書体"],0,"濃度や温度、触媒、表面積などが反応速度に影響する。"],["a3","触媒の働きとして正しいのは？",["反応熱を必ず増やす","活性化エネルギーを下げる経路を与える","平衡定数を必ず変える","反応物を無限に増やす"],1,"触媒は反応経路を変え、正逆反応を速めるが平衡定数自体は変えない。"],["a4","アルカリ金属の一般的な性質は？",["価電子が1個","価電子が8個","すべて不活性","必ず液体"],0,"アルカリ金属は最外殻電子を1個もち、反応性が高い。"],["a5","有機化合物の構造を調べる際に大切なのは？",["官能基を確認する","色だけで決める","分子量は無関係とする","炭素数だけで全て決める"],0,"官能基は有機化合物の性質や反応を判断する重要な手がかり。"],["a6","高分子化合物について正しい説明は？",["小さな分子がつながった構造をもつものが多い","必ず金属","必ず単原子","必ず気体"],0,"多くの高分子はモノマーが重合してできる。"],["f1","【化学反応式】水素と酸素から水ができる反応式を係数で正しくそろえたものは？",["H₂＋O₂→H₂O","2H₂＋O₂→2H₂O","H₂＋2O₂→H₂O₂","2H₂＋2O₂→H₂O"],1,"原子数を左右で数えると、2H₂＋O₂→2H₂O ならHもOも一致する。"],["f1","【モル計算】水 H₂O のモル質量を18 g/molとする。水18 gの物質量は？",["0.5 mol","1 mol","18 mol","324 mol"],1,"物質量 n=m/M=18 g÷18 g/mol=1 mol。単位も確認する。"],["a1","【計算過程】食塩 NaCl の物質量が0.50 mol、モル質量が58.5 g/molのとき質量は？",["11.7 g","29.25 g","58.5 g","117 g"],1,"質量m=nM=0.50 mol×58.5 g/mol=29.25 g。数値を代入して単位を約分する。"],["f2","【酸・塩基】25℃の中性水溶液について正しいものは？",["[H⁺]=[OH⁻]","[H⁺]が必ず0","[OH⁻]が必ず0","pHは必ず7より大きい"],0,"25℃の中性水溶液では水素イオン濃度と水酸化物イオン濃度が等しい。"],["f2","0.010 mol/L の塩酸を完全電離する強酸とみなすと、pHは？",["1","2","7","12"],1,"水素イオン濃度は約10⁻² mol/LなのでpH=2。"],["f3","酸化数が増加する変化は、一般に何と呼ばれる？",["還元","酸化","中和","沈殿"],1,"酸化数の増加は酸化、減少は還元に対応する。"],["f4","溶融した塩化ナトリウムを電気分解すると、陰極で起こる変化は？",["Na⁺が電子を受け取りNaになる","Cl⁻が電子を受け取る","Naが電子を失う","酸素が必ず発生する"],0,"陰極では陽イオンが電子を受け取り、Na⁺+e⁻→Naとなる。"],["a0","一定量の気体を一定温度で圧縮したとき、圧力と体積の関係として正しいのは？",["圧力は体積に比例する","圧力は体積に反比例する","圧力も体積も必ず一定","圧力は体積の二乗に比例する"],1,"温度一定ではボイルの法則 pV=一定が成り立つ。"],["a2","発熱反応の反応エンタルピーΔHの符号は、通常どうなる？",["正","負","必ず0","符号は定義されない"],1,"発熱反応では系から熱が放出され、ΔHは負となる。"],["a3","化学平衡に達した可逆反応で正反応と逆反応の速さは？",["正反応だけが止まる","逆反応だけが止まる","等しくなる","必ず0になる"],2,"動的平衡では正反応と逆反応が同じ速さで進む。"],["a4","ハロゲンに共通する性質として適切なのは？",["周期表の17族に属する","すべて金属である","すべて単原子分子で存在する","反応性が全くない"],0,"ハロゲンは周期表の17族に属する非金属元素。"],["a5","エステルを加水分解するとき、一般に得られるものは？",["アルコールとカルボン酸（またはその塩）","金属と酸素だけ","必ずアミノ酸だけ","炭素原子だけ"],0,"エステルの加水分解では、条件に応じてアルコールとカルボン酸またはその塩が生じる。"],["a6","付加重合の説明として適切なのは？",["不飽和結合をもつ単量体などがつながり高分子をつくる","必ず水だけが生成する","単量体が必ず金属になる","分子が必ず分解して原子になる"],0,"付加重合では、二重結合などをもつ単量体が結合して高分子を形成する。"]];
const TRUE_FALSE=[
["f1","【正誤】化学反応式では、反応前後で各元素の原子数をそろえる。",["正しい","誤り"],0,"化学反応式は係数を調整して、左右の各元素の原子数を一致させる。"],
["a1","【正誤】気体の状態方程式 pV=nRT に代入する温度は、通常セルシウス温度℃のままでよい。",["正しい","誤り"],1,"状態方程式では絶対温度Kを使う。"],
["a2","【正誤】触媒は反応速度を変えるが、平衡定数そのものを変えるわけではない。",["正しい","誤り"],0,"触媒は活性化エネルギーの低い反応経路を与え、正逆反応を速めるが平衡定数は変えない。"]
];
const allNames={"f0":"物質の構成","f1":"物質量と化学反応式","f2":"酸・塩基と中和","f3":"酸化還元","f4":"電池・電気分解","a0":"物質の状態","a1":"気体・溶液","a2":"化学反応と熱","a3":"反応速度・化学平衡","a4":"無機物質","a5":"有機化合物","a6":"高分子化合物"};
const modes={basic:'基本知識を使う問題です。',truefalse:'内容と条件を確認します。',common:'資料や実験の考え方を含む問題を出題します。',mock:'選択範囲から出題し、結果をもとに復習します。'};
const $=id=>document.getElementById(id);let questions=[],idx=0,answers=[],locked=false;
$('selected').textContent='科目：'+(subject==='advanced'?'化学':'化学基礎')+' ／ 範囲：'+units.map(x=>allNames[x]||x).join('・');
$('mode').value=['basic','truefalse','common','mock'].includes(initial)?initial:'basic';$('modeInfo').textContent=modes[$('mode').value];$('mode').addEventListener('change',()=>{$('modeInfo').textContent=modes[$('mode').value]});
function start(list){let source=list||BANK.filter(q=>!units.length||units.includes(q[0]));if(!source.length){$('feedback').textContent='選択範囲の問題は準備中です。範囲選択へ戻ってください。';$('feedback').classList.remove('hidden');return}const mode=$('mode').value;if(!list&&mode==='basic')source=source.slice(0,Math.min(8,source.length));if(!list&&mode==='truefalse')source=TRUE_FALSE.filter(q=>!units.length||units.includes(q[0]));if(!list&&mode==='common')source=source.filter(q=>/条件|関係|推定|仕組み|変化|影響|働き/.test(q[1]));if(!source.length&&mode!=='truefalse')source=list||BANK.filter(q=>!units.length||units.includes(q[0]));if(!source.length){$('feedback').textContent='この単元には正誤問題がまだありません。別の単元か学習方法を選んでください。';$('feedback').classList.remove('hidden');return}questions=[...source].sort(()=>Math.random()-.5);idx=0;answers=[];$('setup').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}
function render(){locked=false;const q=questions[idx];$('counter').textContent=(idx+1)+' / '+questions.length;$('bar').style.width=(idx/questions.length*100)+'%';$('question').textContent=q[1];$('choices').replaceChildren();q[2].forEach((v,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'．'+v;b.addEventListener('click',()=>{if(locked)return;answers[idx]=answers[idx]||{};answers[idx].selected=i;[...$('choices').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});$('choices').append(b)});$('feedback').classList.add('hidden');$('check').disabled=false;$('next').disabled=true;$('next').textContent=idx===questions.length-1?'結果を見る':'次の問題 →'}
$('start').addEventListener('click',()=>start());$('check').addEventListener('click',()=>{if(locked)return;if(!answers[idx]||answers[idx].selected===undefined){$('feedback').textContent='選択肢を選んでください。';$('feedback').classList.remove('hidden');return}locked=true;const q=questions[idx],a=answers[idx];a.correct=a.selected===q[3];[...$('choices').children].forEach((b,i)=>{b.disabled=true;if(i===q[3])b.classList.add('correct');if(i===a.selected&&i!==q[3])b.classList.add('wrong')});$('feedback').textContent=(a.correct?'正解！':'不正解。正解は'+String.fromCharCode(65+q[3])+'。')+q[4];$('feedback').classList.remove('hidden');$('check').disabled=true;$('next').disabled=false});
$('next').addEventListener('click',()=>{if(idx<questions.length-1){idx++;render()}else finish()});
function finish(){ $('quiz').classList.add('hidden');$('result').classList.remove('hidden');const good=answers.filter(a=>a&&a.correct).length,wrong=questions.map((q,i)=>({q,a:answers[i]})).filter(x=>!x.a||!x.a.correct);$('summary').textContent=good+' / '+questions.length+'問正解（正答率 '+Math.round(good/questions.length*100)+'%）';const counts={};wrong.forEach(x=>counts[allNames[x.q[0]]||x.q[0]]=(counts[allNames[x.q[0]]||x.q[0]]||0)+1);$('analysis').textContent=wrong.length?'復習が必要な範囲：'+Object.entries(counts).map(([k,v])=>k+'（'+v+'問）').join('、'):'全問正解！用語や条件も説明できるか確認しよう。';$('missed').innerHTML=wrong.map(x=>'<article class="explain"><b>'+x.q[1]+'</b><p>正解：'+x.q[2][x.q[3]]+'</p><p>'+x.q[4]+'</p></article>').join('')||'間違えた問題はありません。';$('review').disabled=!wrong.length;$('review').onclick=()=>start(wrong.map(x=>x.q));$('again').onclick=()=>{$('setup').classList.remove('hidden');$('result').classList.add('hidden')}}
$('review').disabled=true;
</script></body></html>
