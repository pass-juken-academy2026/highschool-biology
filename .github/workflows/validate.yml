name: Validate static site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check HTML and inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, subprocess, sys, tempfile
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.ids=[]; self.scripts=[]; self.in_script=False; self.buf=[]; self.errors=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if 'id' in a: self.ids.append(a['id'])
                  if tag=='script': self.in_script=True; self.buf=[]
              def handle_data(self, data):
                  if self.in_script: self.buf.append(data)
              def handle_endtag(self, tag):
                  if tag=='script' and self.in_script:
                      self.scripts.append(''.join(self.buf)); self.in_script=False
          files=list(Path('.').rglob('*.html'))
          if not files: print('No HTML files found'); sys.exit(1)
          failed=False
          for f in files:
              a=Audit()
              try: a.feed(f.read_text(encoding='utf-8'))
              except Exception as e: print(f'HTML parse error {f}: {e}'); failed=True; continue
              dup=sorted({i for i in a.ids if a.ids.count(i)>1})
              if dup: print(f'Duplicate IDs in {f}: {dup}'); failed=True
              for n,js in enumerate(a.scripts):
                  if not js.strip(): continue
                  p=Path(tempfile.gettempdir())/f'inline-{abs(hash((str(f),n)))}.js'
                  p.write_text(js,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
                  if r.returncode: print(f'JavaScript syntax error in {f} script {n+1}:\n{r.stderr}'); failed=True
              print(f'Checked {f}: {len(a.scripts)} inline script(s), {len(a.ids)} IDs')
          if failed: sys.exit(1)
          PY

      - name: Check Stage 2 science coverage and answer data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          files = {
              'biology': Path('practice.html').read_text(encoding='utf-8'),
              'chemistry': Path('chemistry/practice.html').read_text(encoding='utf-8'),
              'physics': Path('physics/practice.html').read_text(encoding='utf-8'),
              'earth science': Path('earth-science/practice.html').read_text(encoding='utf-8'),
          }
          required = {
              'biology': ['【実験考察】', '【遺伝】', '対照実験', 'const TRUE_FALSE'],
              'chemistry': ['【化学反応式】', '【モル計算】', '【計算過程】', 'const TRUE_FALSE'],
              'physics': ['【力・運動】', '【計算過程】', '【仕事】', 'const TRUE_FALSE'],
              'earth science': ['【天体】', '【地層・資料読解】', '【気象資料】', 'const TRUE_FALSE'],
          }
          errors = []
          total = 0
          record_re = re.compile(r'\["([^"]+)","([^"]*)",\[([^\]]*)\],(\d+),"([^"]*)"\]')
          for name, source in files.items():
              for marker in required[name]:
                  if marker not in source:
                      errors.append(f'{name}: missing {marker}')
              records = record_re.findall(source)
              if not records:
                  errors.append(f'{name}: no question records found')
              for n, (_, question, raw_choices, raw_answer, explanation) in enumerate(records, 1):
                  choices = re.findall(r'"([^"]*)"', raw_choices)
                  answer = int(raw_answer)
                  if len(choices) < 2 or answer >= len(choices) or not explanation.strip():
                      errors.append(f'{name} question {n}: invalid choices/answer/explanation')
              total += len(records)
          if errors:
              print('Stage 2 science validation errors:')
              print('\n'.join(errors))
              sys.exit(1)
          print(f'Stage 2 science coverage OK; validated {total} question and true-false records')
          PY
      - name: Check common-test stimulus continuity and answer data
        run: node tests/common-test-audit.cjs
