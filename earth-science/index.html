<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google-site-verification" content="mi_-sYmWc6J5m40NB-zwtPSApRsXMZXbgUnEJvr-9a4"><meta name="description" content="高校地学基礎・高校地学の科目選択、範囲別の公式確認と問題演習。"><title>高校地学｜科目・範囲選択</title><style>:root{color-scheme:dark;--bg:#071426;--panel:#10233d;--line:#294563;--txt:#edf5ff;--muted:#c3d5e9;--accent:#7bdcff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#14345a 0,transparent 48%),var(--bg);color:var(--txt);font:16px/1.65 system-ui,-apple-system,sans-serif}main{max-width:900px;margin:auto;padding:20px}h1{font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.2}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:15px 0}.grid,.units,.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.subject,.unit,.mode,.choice{display:flex;gap:10px;align-items:flex-start;padding:13px;border-radius:12px;background:#091a2e;border:1px solid #294563;color:var(--txt)}.subject{align-items:center;font-weight:800;cursor:pointer}.unit,.mode{cursor:pointer}.subject input,.unit input,.mode input{accent-color:var(--accent);width:20px;height:20px;flex-shrink:0;margin-top:3px}button,select{font:inherit;font-weight:800;border-radius:10px;padding:12px 16px;border:1px solid #438bb0;background:#17658b;color:#fff;cursor:pointer;min-height:46px}button{width:100%}button:disabled{opacity:.5;cursor:not-allowed}.pill{display:inline-block;padding:4px 10px;border-radius:99px;background:#203c5d;color:#c9eaff;font-size:.85rem}.error{color:#ffd0c8;min-height:1.4em}.formula,.explain{background:#091a2e;border-left:4px solid var(--accent);padding:13px;margin:12px 0;border-radius:8px}.choice{display:block;width:100%;text-align:left;margin:10px 0;cursor:pointer}.choice.selected{border:2px solid var(--accent)}.choice.correct{border:2px solid #5bd6a3}.choice.wrong{border:2px solid #ff9b9b}.hidden{display:none!important}.progress{height:8px;background:#263d58;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent);width:0}@media(max-width:560px){main{padding:12px}.panel{padding:14px}.grid,.units,.modes{grid-template-columns:1fr}}</style><style id="responsive-layout-polish">/* Responsive layout and touch-target polish; learning data unchanged. */*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:5rem}body{max-width:100%;overflow-wrap:anywhere}img,svg,canvas,video{max-width:100%;height:auto}button,input,select,textarea{font:inherit;max-width:100%;min-width:0}button,a,[role="button"]{touch-action:manipulation}button{min-height:42px}:where(button,a,input,select,textarea,[role="button"],[tabindex]):focus-visible{outline:3px solid #65c9f1;outline-offset:3px}@media(max-width:640px){body{font-size:16px;line-height:1.65}header,main{padding-left:max(16px,env(safe-area-inset-left))!important;padding-right:max(16px,env(safe-area-inset-right))!important}h1{font-size:clamp(1.55rem,7vw,2.25rem)!important;line-height:1.2}h2{font-size:clamp(1.15rem,5vw,1.45rem)}.grid,.cards,.subject-grid,.subjects,.menu-grid,.topic-grid,.cards-grid,.dashboard,.two-col,.three-col{grid-template-columns:minmax(0,1fr)!important}.card,.panel,.topic-card,.menu-card{min-width:0;overflow-wrap:anywhere}button{min-height:44px}.choices button{width:100%;text-align:left;white-space:normal}table{display:block;max-width:100%;overflow-x:auto}pre,code{overflow-wrap:anywhere;white-space:pre-wrap}input,select,textarea{font-size:16px}}</style></head><body><main><p class="muted">PASS JUKEN ACADEMY · 高校理科</p><h1>高校地学 学習メニュー</h1><p class="muted">①科目を選択 → ②範囲を複数選択 → ③学習方法を選んで始める。</p><section class="panel"><h2>① 科目を選択</h2><div class="grid"><label class="subject"><input type="radio" name="subject" value="foundation">地学基礎</label><label class="subject"><input type="radio" name="subject" value="advanced">地学</label></div></section><section class="panel"><h2>② 学習範囲を選択</h2><p class="muted">科目に応じた範囲が表示されます。複数選択できます。</p><div id="units" class="units">先に科目を選んでください。</div><p><button id="all" hidden type="button">表示中の範囲をすべて選択</button></p></section><section class="panel"><h2>③ 学習方法を選択</h2><div class="modes"><label class="mode"><input type="radio" name="mode" value="formula" checked><span><b>公式・重要事項を見る</b><br><small class="muted">用語・法則・意味・条件を確認</small></span></label><label class="mode"><input type="radio" name="mode" value="shortcut"><span><b>覚え方・使い分け</b><br><small class="muted">比較や間違いやすい点を確認</small></span></label><label class="mode"><input type="radio" name="mode" value="basic"><span><b>基本問題</b><br><small class="muted">範囲別に問題を解く</small></span></label><label class="mode"><input type="radio" name="mode" value="truefalse"><span><b>正誤問題</b><br><small class="muted">知識と条件を確認</small></span></label><label class="mode"><input type="radio" name="mode" value="common"><span><b>共通テスト型演習</b><br><small class="muted">資料・実験・グラフを読む</small></span></label><label class="mode"><input type="radio" name="mode" value="mock"><span><b>模擬テスト・弱点分析</b><br><small class="muted">結果と間違いを振り返る</small></span></label></div><p><button id="start">選んだ範囲で始める</button></p><p id="error" class="error" role="status" aria-live="polite"></p></section></main><script>const curriculum={foundation:[["地球の構造・活動","f0"],["地震・火山","f1"],["地層・地史","f2"],["大気・海洋","f3"],["宇宙・地球の誕生","f4"]],advanced:[["地球の形・内部構造","a0"],["プレート運動・地質構造","a1"],["地球史・化石","a2"],["大気の構造と運動","a3"],["海洋と気候","a4"],["太陽・恒星","a5"],["銀河・宇宙論","a6"]]};
const units=document.getElementById('units'),all=document.getElementById('all');function render(){const s=document.querySelector('[name=subject]:checked')?.value;units.replaceChildren();if(!s){units.textContent='先に科目を選んでください。';all.hidden=true;return}curriculum[s].forEach(([label,id])=>{const l=document.createElement('label');l.className='unit';const i=document.createElement('input');i.type='checkbox';i.name='unit';i.value=id;const t=document.createElement('span');t.textContent=label;l.append(i,t);units.append(l)});all.hidden=false}document.querySelectorAll('[name=subject]').forEach(x=>x.addEventListener('change',render));all.addEventListener('click',()=>document.querySelectorAll('[name=unit]').forEach(x=>x.checked=true));document.getElementById('start').addEventListener('click',()=>{const subject=document.querySelector('[name=subject]:checked')?.value,selected=[...document.querySelectorAll('[name=unit]:checked')].map(x=>x.value),mode=document.querySelector('[name=mode]:checked').value;if(!subject){document.getElementById('error').textContent='科目を選んでください。';return}if(!selected.length){document.getElementById('error').textContent='範囲を1つ以上選んでください。';return}const q=new URLSearchParams({subject,units:selected.join(','),mode});location.href=(['formula','shortcut'].includes(mode)?'formulas.html':'practice.html')+'?'+q.toString()});</script></body></html>
